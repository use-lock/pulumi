name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN is required to publish @use-lock/pulumi."
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org > /dev/null

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.261.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.1
          install-only: true

      - name: Set release version
        run: echo "PLUGIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Generate schema
        run: make schema VERSION="$PLUGIN_VERSION"

      - name: Build npm package
        run: make build-sdk VERSION="$PLUGIN_VERSION"

      - name: Release plugin binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean

      - name: Publish SDK to npm
        working-directory: sdk/nodejs/bin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
